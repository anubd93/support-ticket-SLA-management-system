x-php: &php
  build: .
  image: support-ticket-sla-app
  volumes:
    - ./:/var/www/html
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  app:
    <<: *php
    container_name: support-ticket-sla-app
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  queue:
    <<: *php
    command: php artisan queue:work --queue=default,imports --tries=3 --timeout=3600
    depends_on:
      - app
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      - app
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped
